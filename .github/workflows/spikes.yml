name: Spikes (Windows)

# Verifies the project typechecks and that each spike's Windows harness
# (run.ps1) passes on a self-hosted Windows x64 runner. The spikes embed
# native binaries / a JRE into a compiled Bun exe and extract+spawn them,
# so they can only be validated on a real Windows host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-spikes:
    runs-on: [self-hosted, windows, x64]

    # Run every step under PowerShell 7 with an explicit Bypass execution
    # policy. Bypass keeps GitHub's generated step scripts loadable on a
    # runner whose machine policy is Restricted, and — because the spike
    # run.ps1 scripts only re-invoke through Windows PowerShell 5.1 when the
    # process-scope policy is NOT Bypass/Unrestricted — it makes them run
    # directly under pwsh 7 instead of downgrading to 5.1.
    defaults:
      run:
        shell: pwsh -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # --- Spikes -------------------------------------------------------
      # Each run.ps1 exits non-zero on FAIL, which fails the step. They run
      # with `if: ${{ !cancelled() }}` so a failure in one spike still lets
      # the others report, giving a full picture in a single CI run.

      - name: Spike 1 — Bun embed/spawn
        if: ${{ !cancelled() }}
        working-directory: spikes/spike1-bun-embed-spawn
        run: .\run.ps1

      - name: Spike 2 — JRE embed/extract
        if: ${{ !cancelled() }}
        working-directory: spikes/spike2-jre-extract
        run: .\run.ps1

      - name: Spike 3 — Node-LSP runtime
        if: ${{ !cancelled() }}
        working-directory: spikes/spike3-node-lsp
        run: .\run.ps1

  # End-to-end: fetch every asset, compile the single exe (build), and exercise
  # the rollback-safe update flow (update). Runs on the same self-hosted Windows
  # runner, which has network access. GITHUB_TOKEN lifts the api.github.com rate
  # limit so the GitHub-sourced assets resolve without 403s.
  windows-build:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: pwsh -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: airbuild build (fetch + compile single exe)
        run: bun run src/cli/index.ts build --target bun-windows-x64 --out dist/opencode-airgap.exe

      - name: Smoke-run built exe (bootstrap extract + seed config)
        # Non-fatal: this exercises the runtime bootstrap (extract hundreds of
        # MB + seed config) but is not the core build/update contract under
        # test, and opencode main is not yet wired into the exe entry.
        continue-on-error: true
        run: |
          & .\dist\opencode-airgap.exe
          if ($LASTEXITCODE -ne 0) { throw "built exe exited with code $LASTEXITCODE" }
          Write-Host "bootstrap smoke OK"

      - name: airbuild update (rebuild + write versions.lock + atomic replace)
        run: bun run src/cli/index.ts update --target bun-windows-x64 --out dist/opencode-airgap.exe

      - name: Upload exe + versions.lock
        if: ${{ !cancelled() }}
        # Non-fatal: artifact storage quota can be exhausted account-wide, which
        # must not fail the build/update verification itself.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: opencode-airgap-exe
          path: |
            dist/opencode-airgap.exe
            dist/versions.lock
          if-no-files-found: warn
          retention-days: 14
